# The Fly app is named prowl-api: this tool was briefly called Prowl, and the
# app kept that name when the product went back to Forage. This value has to be
# an app that exists, not the product name -- `fly deploy` against a name with
# no app behind it does not fail cleanly, it offers to create a new one, which
# is how you end up with two deployments and traffic still on the old.
#
# Renaming the app is a cutover rather than an edit: anything holding the
# current hostname has to move at the same time. Self-hosting? Change this to
# your own app name.
app = 'prowl-api'
primary_region = 'sin'

[env]
  # Finished analyses are written here so the hub can read "the latest run
  # for this site" after the job that produced it is gone. /data is the volume
  # below; if it did not mount, the store refuses rather than writing to the
  # container's disk, and /api/health reports "db": "missing".
  FORAGE_DB_PATH = "/data/forage.db"

# ONE machine. Job progress lives in process memory, so a second machine
# answers "job not found" for every poll the proxy hands it -- which is what
# the tools front-end showed, as "Status check returned 404", from the day the
# app launched with Fly's default pair. A volume attaches to one machine
# anyway. Self-hosting on Fly: `fly volumes create forage_data --size 1`, and
# keep the count at 1.
[mounts]
  source = "forage_data"
  destination = "/data"


[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  # /api/health existed long before anything called it. A health endpoint
  # nothing polls tells you nothing: the first report of an outage is a user,
  # and by then it has been down for as long as nobody happened to look.
  #
  # grace_period covers a cold start. This app suspends when idle
  # (min_machines_running = 0) and waking it costs more than a request timeout
  # allows -- a tighter check reports a sleeping app as a broken one.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
