events {}

http {
    # Each tool is a separate Fly app. Add new tools here by adding
    # a new upstream block and a new location block below.

    upstream crawl_budget {
        server crawl-budget-analyser.fly.dev:443;
    }

    upstream web_bloat {
        server web-bloat-checker.fly.dev:443;
    }

    server {
        listen 8080;
        server_name tools.onlinejourno.com;

        # ── Tools index page ──────────────────────────────────────────
        location = / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location = /index.html {
            root /usr/share/nginx/html;
        }

        # ── Crawl Budget Analyser ─────────────────────────────────────
        location /crawl-budget-analyser/ {
            proxy_pass https://crawl-budget-analyser.fly.dev/;
            proxy_ssl_server_name on;
            proxy_set_header Host crawl-budget-analyser.fly.dev;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Streamlit websocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # ── Web Bloat Checker ─────────────────────────────────────────
        location /web-bloat-checker/ {
            proxy_pass https://web-bloat-checker.fly.dev/;
            proxy_ssl_server_name on;
            proxy_set_header Host web-bloat-checker.fly.dev;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # Add new tools by copying one of the location blocks above.
        # Pattern:
        #   location /your-tool-name/ {
        #       proxy_pass https://your-tool-name.fly.dev/;
        #       ... (same headers as above)
        #   }
    }
}
