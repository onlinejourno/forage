events {}

http {
    server {
        listen 8080;
        server_name tools.onlinejourno.com;

        # Homepage + Next.js assets (/_next/) + everything not a tool route →
        # the OJDS Next.js app. The two tool prefixes below are longer matches,
        # so nginx routes them to their backends ahead of this catch-all.
        location / {
            proxy_pass https://onlinejourno-tools-web.fly.dev;
            proxy_ssl_server_name on;
            proxy_set_header Host onlinejourno-tools-web.fly.dev;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # /crawl-budget-analyser is now the OJDS Next.js page (Phase 2), served by
        # the catch-all above. That page proxies /crawl-budget-analyser/api/* to the
        # crawl-budget-api FastAPI via a next.config rewrite. The old Streamlit app
        # (crawl-budget-analyser.fly.dev) is retired by this route change.

        # /web-bloat-checker is now the OJDS Next.js page (Phase 3), served by the
        # catch-all above. That page proxies /web-bloat-checker/api/* to the
        # web-bloat-checker Node app via a next.config rewrite. nginx no longer
        # serves the old web-bloat UI directly.
    }
}
