events {}

http {
    server {
        listen 8080;
        server_name tools.onlinejourno.com;

        # Homepage + Next.js assets (/_next/) + everything not a tool route →
        # the OJDS Next.js app. The two tool prefixes below are longer matches,
        # so nginx routes them to their backends ahead of this catch-all.
        location / {
            proxy_pass https://onlinejourno-tools-web.fly.dev;
            proxy_ssl_server_name on;
            proxy_set_header Host onlinejourno-tools-web.fly.dev;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        location /crawl-budget-analyser/ {
            # No trailing slash → preserve the /crawl-budget-analyser/ prefix
            # (the backend serves under that base path, not /).
            proxy_pass https://crawl-budget-analyser.fly.dev;
            proxy_ssl_server_name on;
            proxy_set_header Host crawl-budget-analyser.fly.dev;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        location /web-bloat-checker/ {
            proxy_pass https://web-bloat-checker.fly.dev/;
            proxy_ssl_server_name on;
            proxy_set_header Host web-bloat-checker.fly.dev;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}
