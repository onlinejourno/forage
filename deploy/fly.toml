app = "crawl-budget-analyser"
primary_region = "sin"

[build]
  dockerfile = "deploy/Dockerfile"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

# Persistent volume for the SQLite audit log
[mounts]
  source = "crawl_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
